# A read-only report on the LIVE database: GitHub -> Actions -> "Data report" -> Run workflow.
# It copies scripts/data-report.mjs to the Fly machine over SSH (FLY_API_TOKEN, like the other
# workflows) and runs it there. The script opens the database read-only and prints totals
# (matches, how many ran at once, computer trainers' wins and eliminations). It changes nothing,
# and never reads passwords, tokens or emails.
name: Data report

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name
        default: almia-showdown
        required: true
      player:
        description: Optional in-game name, to list their matches of the last two weeks
        default: ''
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ github.event.inputs.app }}
      PLAYER: ${{ github.event.inputs.player }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the inputs
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::The FLY_API_TOKEN secret is not set."; exit 1; fi
          if ! [[ "$APP" =~ ^[a-z0-9-]{2,40}$ ]]; then echo "::error::Not an app name: $APP"; exit 1; fi
          if ! [[ "$PLAYER" =~ ^[A-Za-z0-9_.-]{0,24}$ ]]; then echo "::error::Not a player name: $PLAYER"; exit 1; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run the report (read-only)
        run: |
          B64=$(base64 -w0 scripts/data-report.mjs)
          flyctl ssh console --app "$APP" -C "sh -c 'echo $B64 | base64 -d > /tmp/data-report.mjs && REPORT_PLAYER=$PLAYER node /tmp/data-report.mjs; rm -f /tmp/data-report.mjs'" | tee report.txt
          sed -n '/REPORT_JSON_START/,/REPORT_JSON_END/p' report.txt | sed '1d;$d' > report.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat report.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: data-report
          path: report.json
