# Launch (or update) the ONLINE game server on Fly.io, entirely from the browser:
#   GitHub -> Actions -> "Launch online server" -> Run workflow.
# It checks out the `online` branch (where the server code lives), creates the Fly app and its
# save disk the first time, and deploys. Running it again later just deploys the latest `online`.
# Needs one repository secret: FLY_API_TOKEN (an organization token from the Fly.io dashboard).
name: Launch online server

on:
  workflow_dispatch:
    inputs:
      app:
        description: Fly app name (becomes <name>.fly.dev)
        default: almia-showdown
        required: true
      region:
        description: Fly region (iad = Virginia)
        default: iad
        required: true
      size:
        description: "Machine: friends (shared, 1 GB, about $7/mo) or launch (dedicated core, 2 GB, about $33/mo)"
        type: choice
        options: [friends, launch]
        default: friends

permissions:
  contents: read
  issues: write

concurrency:
  group: launch-online
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ github.event.inputs.app }}
      REGION: ${{ github.event.inputs.region }}
      SIZE: ${{ github.event.inputs.size }}
    steps:
      - name: Check the Fly token is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Add the FLY_API_TOKEN secret first (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: online
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app (first time only)
        run: |
          # Fly's own answers go to deploy.log too, so a failure here is posted in the issue (the
          # token is only in the environment; flyctl does not print it).
          if flyctl status --app "$APP" > status.log 2>&1; then
            echo "App $APP already exists"
          else
            { echo "== flyctl status --app $APP"; cat status.log; } | tee -a deploy.log
            set +e
            flyctl apps create "$APP" 2>&1 | tee -a deploy.log
            ok=${PIPESTATUS[0]}
            set -e
            if [ "$ok" != "0" ]; then echo "::error::Could not check or create $APP on Fly; Fly's messages are in the issue this run posts."; exit 1; fi
          fi
      - name: Create the save disk (first time only)
        run: |
          if flyctl volumes list --app "$APP" 2>/dev/null | grep -q almia_data; then
            echo "Volume almia_data already exists"
          else
            flyctl volumes create almia_data --app "$APP" --region "$REGION" --size 1 --yes
          fi
      - name: Deploy password (first time only)
        run: |
          if flyctl secrets list --app "$APP" 2>/dev/null | grep -q OPS_TOKEN; then
            echo "OPS_TOKEN already set"
          else
            flyctl secrets set OPS_TOKEN="$(openssl rand -hex 24)" --app "$APP" --stage
          fi
      - name: Deploy
        run: |
          if [ "$SIZE" = "launch" ]; then VM="--vm-size performance-1x --vm-memory 2048"; else VM="--vm-size shared-cpu-2x --vm-memory 1024"; fi
          : > deploy.log
          # Fly can be out of room on the host that holds an (empty) save disk. Then: replace the
          # unattached disk with a fresh one and try again; the last try moves to a second region.
          for attempt in 1 2 3; do
            region="$REGION"
            if [ "$attempt" = "3" ]; then region="ord"; fi
            sed -i "s/^primary_region = .*/primary_region = \"$region\"/" fly.toml
            echo "== attempt $attempt in $region" | tee -a deploy.log
            set +e
            flyctl deploy --config fly.toml --app "$APP" --remote-only --ha=false $VM --build-arg BUILD_ID=${GITHUB_SHA::7} 2>&1 | tee -a deploy.log
            ok=${PIPESTATUS[0]}
            set -e
            if [ "$ok" = "0" ]; then exit 0; fi
            if ! tail -n 40 deploy.log | grep -q "insufficient resources"; then exit 1; fi
            echo "== no room next to the disk: replacing the empty disk" | tee -a deploy.log
            for id in $(flyctl volumes list --app "$APP" --json | jq -r '.[] | select(.name=="almia_data" and (.attached_machine_id==null or .attached_machine_id=="")) | .id'); do
              flyctl volumes destroy "$id" --app "$APP" --yes || true
            done
            next="$REGION"
            if [ "$attempt" = "2" ]; then next="ord"; fi
            flyctl volumes create almia_data --app "$APP" --region "$next" --size 1 --yes
          done
          exit 1
      - name: On failure, post the log tail as an issue (readable without the Actions log viewer)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch deploy.log
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo '```'; tail -n 150 deploy.log; echo '```'; } > body.md
          gh issue create --repo "${{ github.repository }}" --title "Launch failed (run ${{ github.run_id }})" --body-file body.md
      - name: Where to play
        run: |
          echo "### The online game is up: https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: https://$APP.fly.dev/health" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 12); do
            if curl -sf "https://$APP.fly.dev/health" >/dev/null; then echo "Server answering"; exit 0; fi
            sleep 10
          done
          echo "Deployed, but /health did not answer yet; give it a minute."
